<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bay Area Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { height: 100%; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  #map { height: 100%; width: 100%; }
  .title-box {
    position: absolute;
    top: 10px;
    left: 50px;
    z-index: 1000;
    background: rgba(255,255,255,0.9);
    padding: 8px 14px;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    font-size: 16px;
    font-weight: 600;
    color: #222;
  }
  .legend-box {
    background: rgba(255,255,255,0.9);
    padding: 8px 12px;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    font-size: 12px;
    color: #222;
    line-height: 1.4;
  }
  .legend-swatch {
    display: inline-block;
    width: 14px;
    height: 14px;
    background: #ff0000;
    opacity: 0.35;
    border: 1px solid #b30000;
    vertical-align: middle;
    margin-right: 6px;
  }
  .legend-swatch-stripe {
    display: inline-block;
    width: 14px;
    height: 14px;
    background: repeating-linear-gradient(45deg, rgba(26,95,180,0.55) 0 3px, rgba(74,144,226,0.28) 3px 6px);
    border: 1px solid #1a5fb4;
    vertical-align: middle;
    margin-right: 6px;
  }
  .legend-swatch-solid-blue {
    display: inline-block;
    width: 14px;
    height: 14px;
    background: #3366ff;
    opacity: 0.55;
    border: 1px solid #0b3d91;
    vertical-align: middle;
    margin-right: 6px;
  }
  .legend-swatch-tan {
    display: inline-block;
    width: 14px;
    height: 14px;
    background: #d2b48c;
    opacity: 0.6;
    border: 1px solid #8b7355;
    vertical-align: middle;
    margin-right: 6px;
  }
  .legend-swatch-gray {
    display: inline-block;
    width: 14px;
    height: 14px;
    background: #808080;
    opacity: 0.55;
    border: 1px solid #4d4d4d;
    vertical-align: middle;
    margin-right: 6px;
  }
  .legend-swatch-indigo {
    display: inline-block;
    width: 14px;
    height: 14px;
    background: #4b0082;
    opacity: 0.45;
    border: 1px solid #2e0854;
    vertical-align: middle;
    margin-right: 6px;
  }
  .legend-swatch-outline-navy {
    display: inline-block;
    width: 14px;
    height: 14px;
    background: transparent;
    border: 2px solid #00008b;
    vertical-align: middle;
    margin-right: 6px;
  }
</style>
</head>
<body>
<div class="title-box">San Francisco Bay Area</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/fire_hazard.js"></script>
<script src="data/flood_100yr.js"></script>
<script src="data/flood_500yr.js"></script>
<script src="data/faults.js"></script>
<script src="data/liquefaction.js"></script>
<script src="data/landslide.js"></script>
<script src="data/tsunami.js"></script>
<script src="data/dam_inundation.js"></script>
<script>
  const map = L.map('map').setView([37.7749, -122.2200], 10);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  const cities = [
    { name: "San Francisco", coords: [37.7749, -122.4194] },
    { name: "Oakland", coords: [37.8044, -122.2712] },
    { name: "Berkeley", coords: [37.8715, -122.2730] },
    { name: "San Jose", coords: [37.3382, -121.8863] },
    { name: "Palo Alto", coords: [37.4419, -122.1430] },
    { name: "Fremont", coords: [37.5485, -121.9886] },
    { name: "Richmond", coords: [37.9358, -122.3477] },
    { name: "San Mateo", coords: [37.5630, -122.3255] },
    { name: "Walnut Creek", coords: [37.9101, -122.0652] },
    { name: "Vallejo", coords: [38.1041, -122.2566] },
  ];

  cities.forEach(city => {
    L.marker(city.coords).addTo(map).bindPopup(`<b>${city.name}</b>`);
  });

  // --- Very High Fire Hazard Severity Zones (CAL FIRE FRAP, State GIS) ---
  // Loaded from data/fire_hazard.js, cached locally by scripts/fetch_data.py
  // (see that file to refresh). Rendered on canvas rather than SVG since
  // these layers can carry thousands of polygons; canvas holds up far
  // better under pan/zoom than one DOM node per polygon.
  const hazardRenderer = L.canvas();

  const fhszLayer = L.geoJSON(FIRE_HAZARD_DATA, {
    renderer: hazardRenderer,
    style: { color: '#b30000', weight: 1, fillColor: '#ff0000', fillOpacity: 0.35 }
  });

  // --- FEMA flood hazard zones (National Flood Hazard Layer) ---
  // Loaded from data/flood_100yr.js / data/flood_500yr.js, same cache.
  // The 100-year layer uses a diagonal-stripe canvas pattern as its
  // fillStyle (Leaflet just forwards style.fillColor to ctx.fillStyle,
  // which accepts a CanvasPattern, not only a color string).
  const stripeTile = document.createElement('canvas');
  stripeTile.width = 8;
  stripeTile.height = 8;
  const stripeCtx = stripeTile.getContext('2d');
  stripeCtx.fillStyle = 'rgba(74,144,226,0.28)';
  stripeCtx.fillRect(0, 0, 8, 8);
  stripeCtx.strokeStyle = 'rgba(26,95,180,0.65)';
  stripeCtx.lineWidth = 4;
  stripeCtx.beginPath();
  stripeCtx.moveTo(0, 0);
  stripeCtx.lineTo(0, 8);
  stripeCtx.stroke();
  const stripePattern = stripeCtx.createPattern(stripeTile, 'repeat');
  stripePattern.setTransform(new DOMMatrix().rotate(45));

  // Swapped per request: 100-year now solid/more opaque, 500-year now striped.
  const flood100Layer = L.geoJSON(FLOOD_100YR_DATA, {
    renderer: hazardRenderer,
    style: { color: '#0b3d91', weight: 1, fillColor: '#3366ff', fillOpacity: 0.55 }
  });

  const flood500Layer = L.geoJSON(FLOOD_500YR_DATA, {
    renderer: hazardRenderer,
    style: { color: '#1a5fb4', weight: 1, fillColor: stripePattern, fillOpacity: 1 }
  });

  // --- Earthquake fault traces (CGS Fault & Fold DB, filtered to the
  // named major Bay Area fault zones) ---
  const faultLayer = L.geoJSON(FAULT_DATA, {
    renderer: hazardRenderer,
    style: { color: '#7b3f00', weight: 2 }
  });

  // --- CGS liquefaction & landslide zones (earthquake-triggered ground failure) ---
  const liquefactionLayer = L.geoJSON(LIQUEFACTION_DATA, {
    renderer: hazardRenderer,
    style: { color: '#8b7355', weight: 1, fillColor: '#d2b48c', fillOpacity: 0.6 }
  });

  const landslideLayer = L.geoJSON(LANDSLIDE_DATA, {
    renderer: hazardRenderer,
    style: { color: '#4d4d4d', weight: 1, fillColor: '#808080', fillOpacity: 0.55 }
  });

  // --- CA tsunami hazard area (Cal OES / CGS) ---
  const tsunamiLayer = L.geoJSON(TSUNAMI_DATA, {
    renderer: hazardRenderer,
    style: { color: '#2e0854', weight: 1, fillColor: '#4b0082', fillOpacity: 0.45 }
  });

  // --- Dam failure inundation areas (Cal OES/DSOD) — outline only, no fill ---
  const damLayer = L.geoJSON(DAM_INUNDATION_DATA, {
    renderer: hazardRenderer,
    style: { color: '#00008b', weight: 2, fill: false }
  });

  fhszLayer.addTo(map);

  L.control.layers(null, {
    'Very High Fire Hazard Zones': fhszLayer,
    '100-Year Flood Zone (1% annual chance)': flood100Layer,
    '500-Year Flood Zone (0.2% annual chance)': flood500Layer,
    'Major Earthquake Faults': faultLayer,
    'Liquefaction Zones': liquefactionLayer,
    'Landslide Zones': landslideLayer,
    'Tsunami Hazard Area': tsunamiLayer,
    'Dam Failure Inundation Area': damLayer
  }, { collapsed: false }).addTo(map);

  const legend = L.control({ position: 'bottomleft' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend-box');
    div.innerHTML = '<span class="legend-swatch"></span>Very High Fire Hazard Severity Zone<br>' +
      '<span class="legend-swatch-solid-blue"></span>100-Year Flood Zone (1% annual chance)<br>' +
      '<span class="legend-swatch-stripe"></span>500-Year Flood Zone (0.2% annual chance)<br>' +
      '<span style="display:inline-block;width:14px;height:2px;background:#7b3f00;vertical-align:middle;margin-right:6px;"></span>Major Earthquake Fault<br>' +
      '<span class="legend-swatch-tan"></span>Liquefaction Zone<br>' +
      '<span class="legend-swatch-gray"></span>Landslide Zone<br>' +
      '<span class="legend-swatch-indigo"></span>Tsunami Hazard Area<br>' +
      '<span class="legend-swatch-outline-navy"></span>Dam Failure Inundation Area<br>' +
      '<span style="font-size:10px;color:#555;">Sources: CAL FIRE FRAP; FEMA NFHL; CGS Fault &amp; Fold DB, Liquefaction &amp; Landslide Zones; CA Tsunami Hazard Area; Cal OES/DSOD Dam Inundation</span>';
    return div;
  };
  legend.addTo(map);
</script>
</body>
</html>
